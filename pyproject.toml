[project]
name = "braintrust-classification-scorers"
version = "0.1.0"
description = "Set-based precision, recall, and F1 scorers for Braintrust evals"
requires-python = ">=3.10"
dependencies = ["braintrust"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
